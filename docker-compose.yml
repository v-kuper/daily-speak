services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: daily-speaking-web
    restart: unless-stopped
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:3219}
    ports:
      - "0.0.0.0:${APP_PORT:-3218}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/web-healthz').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daily-speaking-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/daily_speaking
      SERVER_LOG_LEVEL: info
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3218,http://localhost:3219}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:31b-cloud}
      OLLAMA_THINKING_MODEL: ${OLLAMA_THINKING_MODEL:-true}
      AI_ANALYSIS_CONCURRENCY: ${AI_ANALYSIS_CONCURRENCY:-3}
      WHISPER_BACKEND: ${WHISPER_BACKEND:-openai}
      WHISPER_BINARY_PATH: ${WHISPER_BINARY_PATH:-}
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-}
      WHISPER_PYTHON_BIN: ${WHISPER_PYTHON_BIN:-/opt/whisper/bin/python}
      WHISPER_OPENAI_MODEL: ${WHISPER_OPENAI_MODEL:-base}
      WHISPER_OPENAI_MODEL_DIR: ${WHISPER_OPENAI_MODEL_DIR:-/app/tools/whisper/openai-models}
      WHISPER_OPENAI_CACHE_DIR: ${WHISPER_OPENAI_CACHE_DIR:-/app/tools/whisper/cache}
      WHISPER_FFMPEG_BIN: ${WHISPER_FFMPEG_BIN:-/usr/bin/ffmpeg}
      WHISPER_OPENAI_DEVICE: ${WHISPER_OPENAI_DEVICE:-cpu}
      WHISPER_OPENAI_FP16: ${WHISPER_OPENAI_FP16:-false}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-auto}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      CARTESIA_VOICE_ID: ${CARTESIA_VOICE_ID:-}
      CARTESIA_MODEL: ${CARTESIA_MODEL:-sonic-3.6}
      CARTESIA_API_URL: ${CARTESIA_API_URL:-https://api.cartesia.ai/tts/bytes}
      CARTESIA_API_VERSION: ${CARTESIA_API_VERSION:-2026-08-14}
    ports:
      - "0.0.0.0:${API_PORT:-3219}:3000"
    volumes:
      - ${WHISPER_TOOLS_HOST_DIR:-./backend/tools}:/app/tools
      - ${UPLOADS_HOST_DIR:-./.data/uploads}:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  lan-https:
    image: caddy:2-alpine
    container_name: daily-speaking-lan-https
    restart: unless-stopped
    depends_on:
      - web
      - backend
    ports:
      - "0.0.0.0:${HTTPS_PORT:-3443}:${HTTPS_PORT:-3443}"
      - "0.0.0.0:${API_HTTPS_PORT:-3444}:${API_HTTPS_PORT:-3444}"
    volumes:
      - ./lan-https/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./lan-https/certs:/certs:ro

  postgres:
    image: postgres:16-alpine
    container_name: daily-speaking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: daily_speaking
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daily_speaking"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
