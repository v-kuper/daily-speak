services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: daily-speaking-web
    restart: unless-stopped
    environment:
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:-}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:3219}
    ports:
      - "0.0.0.0:${APP_PORT:-3218}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/web-healthz').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daily-speaking-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/daily_speaking
      SERVER_LOG_LEVEL: info
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3218,http://localhost:3219}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:-}
      AUTH_ACCESS_TOKEN_ISSUER: ${AUTH_ACCESS_TOKEN_ISSUER:-daily-speaking-api}
      AUTH_ACCESS_TOKEN_AUDIENCE: ${AUTH_ACCESS_TOKEN_AUDIENCE:-daily-speaking-mobile}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-15m}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-720h}
      AUTH_GUEST_TOKEN_TTL: ${AUTH_GUEST_TOKEN_TTL:-24h}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_AUTH_REQUESTS: ${RATE_LIMIT_AUTH_REQUESTS:-20}
      RATE_LIMIT_AUTH_WINDOW: ${RATE_LIMIT_AUTH_WINDOW:-1m}
      RATE_LIMIT_WRITE_REQUESTS: ${RATE_LIMIT_WRITE_REQUESTS:-120}
      RATE_LIMIT_WRITE_WINDOW: ${RATE_LIMIT_WRITE_WINDOW:-1m}
      RATE_LIMIT_EXPENSIVE_REQUESTS: ${RATE_LIMIT_EXPENSIVE_REQUESTS:-20}
      RATE_LIMIT_EXPENSIVE_WINDOW: ${RATE_LIMIT_EXPENSIVE_WINDOW:-1h}
      READINESS_TIMEOUT: ${READINESS_TIMEOUT:-2s}
      READINESS_MAX_QUEUE_DEPTH: ${READINESS_MAX_QUEUE_DEPTH:-1000}
      READINESS_MAX_OLDEST_JOB_AGE: ${READINESS_MAX_OLDEST_JOB_AGE:-30m}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      GUEST_PREVIEW_QUEUE_CAPACITY: ${GUEST_PREVIEW_QUEUE_CAPACITY:-100}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
      MEDIA_STORAGE_DRIVER: ${MEDIA_STORAGE_DRIVER:-local}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-}
      MEDIA_S3_FORCE_PATH_STYLE: ${MEDIA_S3_FORCE_PATH_STYLE:-false}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-}
      MEDIA_S3_SESSION_TOKEN: ${MEDIA_S3_SESSION_TOKEN:-}
      MEDIA_UPLOAD_URL_TTL: ${MEDIA_UPLOAD_URL_TTL:-15m}
      MEDIA_MULTIPART_PART_SIZE_BYTES: ${MEDIA_MULTIPART_PART_SIZE_BYTES:-8388608}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:31b-cloud}
      OLLAMA_THINKING_MODEL: ${OLLAMA_THINKING_MODEL:-true}
      AI_ANALYSIS_CONCURRENCY: ${AI_ANALYSIS_CONCURRENCY:-3}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      CARTESIA_VOICE_ID: ${CARTESIA_VOICE_ID:-}
      CARTESIA_MODEL: ${CARTESIA_MODEL:-sonic-3.6}
      CARTESIA_API_URL: ${CARTESIA_API_URL:-https://api.cartesia.ai/tts/bytes}
      CARTESIA_API_VERSION: ${CARTESIA_API_VERSION:-2026-08-14}
    ports:
      - "0.0.0.0:${API_PORT:-3219}:3000"
    volumes:
      - ${UPLOADS_HOST_DIR:-./.data/uploads}:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["./daily-speaking-worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/daily_speaking
      SERVER_LOG_LEVEL: info
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
      MEDIA_STORAGE_DRIVER: ${MEDIA_STORAGE_DRIVER:-local}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-}
      MEDIA_S3_FORCE_PATH_STYLE: ${MEDIA_S3_FORCE_PATH_STYLE:-false}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-}
      MEDIA_S3_SESSION_TOKEN: ${MEDIA_S3_SESSION_TOKEN:-}
      MEDIA_UPLOAD_URL_TTL: ${MEDIA_UPLOAD_URL_TTL:-15m}
      MEDIA_MULTIPART_PART_SIZE_BYTES: ${MEDIA_MULTIPART_PART_SIZE_BYTES:-8388608}
      MEDIA_SWEEP_INTERVAL: ${MEDIA_SWEEP_INTERVAL:-15m}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:31b-cloud}
      OLLAMA_THINKING_MODEL: ${OLLAMA_THINKING_MODEL:-true}
      AI_ANALYSIS_CONCURRENCY: ${AI_ANALYSIS_CONCURRENCY:-3}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_WHISPER_MODEL: ${GROQ_WHISPER_MODEL:-whisper-large-v3-turbo}
      TRANSCRIPTION_LANGUAGE: ${TRANSCRIPTION_LANGUAGE:-auto}
      TRANSCRIPTION_PROMPT: ${TRANSCRIPTION_PROMPT:-}
      FFMPEG_BINARY_PATH: ${FFMPEG_BINARY_PATH:-/usr/bin/ffmpeg}
      FFPROBE_BINARY_PATH: ${FFPROBE_BINARY_PATH:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      CARTESIA_VOICE_ID: ${CARTESIA_VOICE_ID:-}
      CARTESIA_MODEL: ${CARTESIA_MODEL:-sonic-3.6}
      CARTESIA_API_URL: ${CARTESIA_API_URL:-https://api.cartesia.ai/tts/bytes}
      CARTESIA_API_VERSION: ${CARTESIA_API_VERSION:-2026-08-14}
      WORKER_RECORDING_CONCURRENCY: ${WORKER_RECORDING_CONCURRENCY:-1}
      WORKER_GUEST_PREVIEW_CONCURRENCY: ${WORKER_GUEST_PREVIEW_CONCURRENCY:-1}
      WORKER_SHADOWING_CONCURRENCY: ${WORKER_SHADOWING_CONCURRENCY:-2}
      WORKER_CLEANUP_CONCURRENCY: ${WORKER_CLEANUP_CONCURRENCY:-2}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-1s}
      WORKER_LEASE_DURATION: ${WORKER_LEASE_DURATION:-2m}
      WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-30s}
      WORKER_RETRY_BASE_DELAY: ${WORKER_RETRY_BASE_DELAY:-5s}
      WORKER_RETRY_MAX_DELAY: ${WORKER_RETRY_MAX_DELAY:-5m}
      WORKER_JOB_RETENTION: ${WORKER_JOB_RETENTION:-720h}
    volumes:
      - ${UPLOADS_HOST_DIR:-./.data/uploads}:/app/uploads

  lan-https:
    image: caddy:2-alpine
    container_name: daily-speaking-lan-https
    restart: unless-stopped
    depends_on:
      - web
      - backend
    ports:
      - "0.0.0.0:${HTTPS_PORT:-3443}:${HTTPS_PORT:-3443}"
      - "0.0.0.0:${API_HTTPS_PORT:-3444}:${API_HTTPS_PORT:-3444}"
    volumes:
      - ./lan-https/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./lan-https/certs:/certs:ro

  postgres:
    image: postgres:16-alpine
    container_name: daily-speaking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: daily_speaking
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daily_speaking"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
