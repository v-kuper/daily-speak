name: Quality Gates

on:
  push:
    branches:
      - main
      - master
      - 'codex/**'
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daily_speaking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d daily_speaking"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Web quality gates
        run: npm run quality --prefix web

      - name: Web production build
        env:
          PUBLIC_API_BASE_URL: http://localhost:3219
        run: npm run build --prefix web

      - name: Backend tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/daily_speaking
        run: cd backend && go test ./...

      - name: API documentation checks
        run: npm run test:api-docs

      - name: Infrastructure contract tests
        run: npm run test:infra

      - name: Backend smoke checks
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/daily_speaking
        run: npm run test:smoke

      - name: Build independent application images
        run: docker compose build web backend
