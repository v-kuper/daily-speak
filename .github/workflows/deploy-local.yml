name: Deploy Local Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: daily-speaking-local-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, windows, daily-speaking]
    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      COMPOSE_PROJECT_NAME: daily-speaking
      APP_PORT: ${{ vars.APP_PORT || '3218' }}
      API_PORT: ${{ vars.API_PORT || '3219' }}
      HTTPS_PORT: ${{ vars.HTTPS_PORT || '3443' }}
      API_HTTPS_PORT: ${{ vars.API_HTTPS_PORT || '3444' }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT || '5433' }}
      UPLOADS_HOST_DIR: ${{ vars.UPLOADS_HOST_DIR || 'D:\DailySpeaking\data\uploads' }}
      UPLOADS_DIR: /app/uploads
      MEDIA_STORAGE_DRIVER: local
      MEDIA_S3_REGION: ${{ vars.MEDIA_S3_REGION || '' }}
      MEDIA_S3_BUCKET: ${{ vars.MEDIA_S3_BUCKET || '' }}
      MEDIA_S3_ENDPOINT: ${{ vars.MEDIA_S3_ENDPOINT || '' }}
      MEDIA_S3_FORCE_PATH_STYLE: ${{ vars.MEDIA_S3_FORCE_PATH_STYLE || 'false' }}
      MEDIA_UPLOAD_URL_TTL: ${{ vars.MEDIA_UPLOAD_URL_TTL || '15m' }}
      MEDIA_MULTIPART_PART_SIZE_BYTES: ${{ vars.MEDIA_MULTIPART_PART_SIZE_BYTES || '8388608' }}
      MEDIA_SWEEP_INTERVAL: ${{ vars.MEDIA_SWEEP_INTERVAL || '15m' }}
      GUEST_PREVIEW_QUEUE_CAPACITY: ${{ vars.GUEST_PREVIEW_QUEUE_CAPACITY || '100' }}
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL || 'http://host.docker.internal:11434' }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'gemma4:31b-cloud' }}
      OLLAMA_THINKING_MODEL: ${{ vars.OLLAMA_THINKING_MODEL || 'true' }}
      AI_ANALYSIS_CONCURRENCY: 3
      WORKER_RECORDING_CONCURRENCY: 1
      WORKER_GUEST_PREVIEW_CONCURRENCY: 1
      WORKER_SHADOWING_CONCURRENCY: 2
      WORKER_CLEANUP_CONCURRENCY: 2
      WORKER_POLL_INTERVAL: 1s
      WORKER_LEASE_DURATION: 2m
      WORKER_HEARTBEAT_INTERVAL: 30s
      WORKER_RETRY_BASE_DELAY: 5s
      WORKER_RETRY_MAX_DELAY: 5m
      WORKER_JOB_RETENTION: ${{ vars.WORKER_JOB_RETENTION || '720h' }}
      AUTH_ACCESS_TOKEN_ISSUER: ${{ vars.AUTH_ACCESS_TOKEN_ISSUER || 'daily-speaking-api' }}
      AUTH_ACCESS_TOKEN_AUDIENCE: ${{ vars.AUTH_ACCESS_TOKEN_AUDIENCE || 'daily-speaking-mobile' }}
      AUTH_ACCESS_TOKEN_TTL: ${{ vars.AUTH_ACCESS_TOKEN_TTL || '15m' }}
      AUTH_REFRESH_TOKEN_TTL: ${{ vars.AUTH_REFRESH_TOKEN_TTL || '720h' }}
      AUTH_GUEST_TOKEN_TTL: ${{ vars.AUTH_GUEST_TOKEN_TTL || '24h' }}
      TRUSTED_PROXY_CIDRS: ${{ vars.TRUSTED_PROXY_CIDRS || '172.16.0.0/12' }}
      RATE_LIMIT_ENABLED: ${{ vars.RATE_LIMIT_ENABLED || 'true' }}
      RATE_LIMIT_AUTH_REQUESTS: ${{ vars.RATE_LIMIT_AUTH_REQUESTS || '20' }}
      RATE_LIMIT_AUTH_WINDOW: ${{ vars.RATE_LIMIT_AUTH_WINDOW || '1m' }}
      RATE_LIMIT_WRITE_REQUESTS: ${{ vars.RATE_LIMIT_WRITE_REQUESTS || '120' }}
      RATE_LIMIT_WRITE_WINDOW: ${{ vars.RATE_LIMIT_WRITE_WINDOW || '1m' }}
      RATE_LIMIT_EXPENSIVE_REQUESTS: ${{ vars.RATE_LIMIT_EXPENSIVE_REQUESTS || '20' }}
      RATE_LIMIT_EXPENSIVE_WINDOW: ${{ vars.RATE_LIMIT_EXPENSIVE_WINDOW || '1h' }}
      READINESS_TIMEOUT: ${{ vars.READINESS_TIMEOUT || '2s' }}
      READINESS_MAX_QUEUE_DEPTH: ${{ vars.READINESS_MAX_QUEUE_DEPTH || '1000' }}
      READINESS_MAX_OLDEST_JOB_AGE: ${{ vars.READINESS_MAX_OLDEST_JOB_AGE || '30m' }}
      GROQ_WHISPER_MODEL: whisper-large-v3-turbo
      TRANSCRIPTION_LANGUAGE: auto
      FFMPEG_BINARY_PATH: /usr/bin/ffmpeg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cartesia configuration
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          CARTESIA_VOICE_ID: ${{ vars.CARTESIA_VOICE_ID }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:CARTESIA_API_KEY)) {
            $missing += "GitHub Actions secret CARTESIA_API_KEY"
          }
          if ([string]::IsNullOrWhiteSpace($env:CARTESIA_VOICE_ID)) {
            $missing += "GitHub Actions variable CARTESIA_VOICE_ID"
          }
          if ($missing.Count -gt 0) {
            throw "Missing required Cartesia configuration: $($missing -join ', ')."
          }

      - name: Validate identity configuration
        env:
          AUTH_ACCESS_TOKEN_SECRET: ${{ secrets.AUTH_ACCESS_TOKEN_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUTH_ACCESS_TOKEN_SECRET)) {
            throw "Missing required GitHub Actions secret AUTH_ACCESS_TOKEN_SECRET. Add it under repository Settings > Secrets and variables > Actions > Secrets."
          }
          $signingSecret = $env:AUTH_ACCESS_TOKEN_SECRET.Trim()
          if ($signingSecret.Length -lt 32) {
            throw "GitHub Actions secret AUTH_ACCESS_TOKEN_SECRET must contain at least 32 characters."
          }

      - name: Validate Groq configuration
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GROQ_API_KEY)) {
            throw "Missing required GitHub Actions secret GROQ_API_KEY. Add it under repository Settings > Secrets and variables > Actions > Secrets."
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Quality gates
        run: npm run quality

      - name: Check Docker
        run: docker version

      - name: Build and start local Docker HTTPS stack
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          CARTESIA_VOICE_ID: ${{ vars.CARTESIA_VOICE_ID }}
          AUTH_ACCESS_TOKEN_SECRET: ${{ secrets.AUTH_ACCESS_TOKEN_SECRET }}
          METRICS_BEARER_TOKEN: ${{ secrets.METRICS_BEARER_TOKEN }}
          MEDIA_S3_ACCESS_KEY_ID: ${{ secrets.MEDIA_S3_ACCESS_KEY_ID }}
          MEDIA_S3_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_S3_SECRET_ACCESS_KEY }}
          MEDIA_S3_SESSION_TOKEN: ${{ secrets.MEDIA_S3_SESSION_TOKEN }}
        run: .\scripts\setup-lan-https-proxy.ps1

      - name: Verify Docker identity configuration
        run: |
          docker compose exec -T backend sh -lc 'test "${#AUTH_ACCESS_TOKEN_SECRET}" -ge 32 && echo identity-config-ok'

      - name: Smoke separate HTTP services
        run: |
          $env:WEB_BASE_URL = "http://${env:LAN_HOST_IP}:${env:APP_PORT}"
          $env:EXPECTED_WEB_REDIRECT_BASE_URL = "https://${env:LAN_HOST_IP}:${env:HTTPS_PORT}"
          $env:API_BASE_URL = "http://${env:LAN_HOST_IP}:${env:API_PORT}"
          node scripts/smoke-stack.mjs

      - name: Verify trusted HTTPS endpoints
        run: |
          $mkcertCaRoot = (& mkcert -CAROOT).Trim()
          if ([string]::IsNullOrWhiteSpace($mkcertCaRoot)) {
            throw "mkcert did not return its CA root directory."
          }

          $mkcertRootCaPath = Join-Path $mkcertCaRoot "rootCA.pem"
          if (-not (Test-Path -LiteralPath $mkcertRootCaPath -PathType Leaf)) {
            throw "mkcert root CA file was not found."
          }

          $env:NODE_EXTRA_CA_CERTS = (Resolve-Path -LiteralPath $mkcertRootCaPath).Path
          $env:WEB_BASE_URL = "https://${env:LAN_HOST_IP}:${env:HTTPS_PORT}"
          $env:API_BASE_URL = "https://${env:LAN_HOST_IP}:${env:API_HTTPS_PORT}"
          node scripts/smoke-stack.mjs

      - name: Verify Docker Groq configuration
        run: |
          docker compose exec -T worker ./daily-speaking-worker --check-groq

      - name: Verify Docker Cartesia configuration
        run: |
          docker compose exec -T worker sh -lc 'test -n "$CARTESIA_API_KEY" && test -n "$CARTESIA_VOICE_ID" && echo cartesia-config-ok'

      - name: Deployment diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 120 web
          docker compose logs --tail 120 backend
          docker compose logs --tail 120 worker
          docker compose logs --tail 120 lan-https
