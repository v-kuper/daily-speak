name: Deploy Local Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: daily-speaking-local-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, windows, daily-speaking]
    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    env:
      COMPOSE_PROJECT_NAME: daily-speaking
      APP_PORT: ${{ vars.APP_PORT || '3218' }}
      API_PORT: ${{ vars.API_PORT || '3219' }}
      HTTPS_PORT: ${{ vars.HTTPS_PORT || '3443' }}
      API_HTTPS_PORT: ${{ vars.API_HTTPS_PORT || '3444' }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT || '5433' }}
      UPLOADS_HOST_DIR: ${{ vars.UPLOADS_HOST_DIR || 'D:\DailySpeaking\data\uploads' }}
      UPLOADS_DIR: /app/uploads
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL || 'http://host.docker.internal:11434' }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'gemma4:31b-cloud' }}
      OLLAMA_THINKING_MODEL: ${{ vars.OLLAMA_THINKING_MODEL || 'true' }}
      AI_ANALYSIS_CONCURRENCY: 3
      WHISPER_BACKEND: openai
      WHISPER_BINARY_PATH: ${{ vars.WHISPER_BINARY_PATH || '' }}
      WHISPER_MODEL_PATH: ${{ vars.WHISPER_MODEL_PATH || '' }}
      WHISPER_PYTHON_BIN: /opt/whisper/bin/python
      WHISPER_OPENAI_MODEL: base
      WHISPER_OPENAI_MODEL_DIR: /app/tools/whisper/openai-models
      WHISPER_OPENAI_CACHE_DIR: /app/tools/whisper/cache
      WHISPER_FFMPEG_BIN: /usr/bin/ffmpeg
      WHISPER_OPENAI_DEVICE: cpu
      WHISPER_OPENAI_FP16: false
      WHISPER_LANGUAGE: auto

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cartesia configuration
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          CARTESIA_VOICE_ID: ${{ vars.CARTESIA_VOICE_ID }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:CARTESIA_API_KEY)) {
            $missing += "GitHub Actions secret CARTESIA_API_KEY"
          }
          if ([string]::IsNullOrWhiteSpace($env:CARTESIA_VOICE_ID)) {
            $missing += "GitHub Actions variable CARTESIA_VOICE_ID"
          }
          if ($missing.Count -gt 0) {
            throw "Missing required Cartesia configuration: $($missing -join ', ')."
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Quality gates
        run: npm run quality

      - name: Check Docker
        run: docker version

      - name: Build and start local Docker HTTPS stack
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          CARTESIA_VOICE_ID: ${{ vars.CARTESIA_VOICE_ID }}
        run: .\scripts\setup-lan-https-proxy.ps1

      - name: Smoke separate HTTP services
        run: |
          $env:WEB_BASE_URL = "http://${env:LAN_HOST_IP}:${env:APP_PORT}"
          $env:API_BASE_URL = "http://${env:LAN_HOST_IP}:${env:API_PORT}"
          node scripts/smoke-stack.mjs

      - name: Verify trusted HTTPS endpoints
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          function ConvertTo-SafeHttpsFailure {
            param(
              [Parameter(Mandatory = $true)]
              [System.Management.Automation.ErrorRecord]$ErrorRecord
            )

            $exceptionType = $ErrorRecord.Exception.GetType().FullName
            $exceptionMessage = [string]$ErrorRecord.Exception.Message
            $exceptionMessage = ($exceptionMessage -replace '[\r\n]+', ' ').Trim()
            $exceptionMessage = $exceptionMessage -replace '(?i)(https?://[^:/\s]+):[^@\s/]+@', '$1:[redacted]@'
            $exceptionMessage = $exceptionMessage -replace '(?i)(https?://[^\s?#]+)\?[^\s#]*', '$1?[redacted]'
            $exceptionMessage = $exceptionMessage -replace '(?i)\b(authorization|cookie|set-cookie|token|api[_-]?key)\s*[:=]\s*[^\s,;]+', '$1=[redacted]'
            if ([string]::IsNullOrWhiteSpace($exceptionMessage)) {
              $exceptionMessage = "No message supplied."
            }
            if ($exceptionMessage.Length -gt 240) {
              $exceptionMessage = $exceptionMessage.Substring(0, 240) + "..."
            }

            return "${exceptionType}: $exceptionMessage"
          }

          function Invoke-TrustedHttpsWithRetry {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Name,
              [Parameter(Mandatory = $true)]
              [scriptblock]$Request,
              [Parameter(Mandatory = $true)]
              [scriptblock]$IsReady,
              [int]$MaxAttempts = 6,
              [int]$DelaySeconds = 2
            )

            $lastFailure = "request was not completed."
            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              try {
                $response = & $Request
                if (& $IsReady $response) {
                  return $response
                }
                $lastFailure = "request returned a response that failed readiness validation."
              } catch {
                $lastFailure = ConvertTo-SafeHttpsFailure -ErrorRecord $_
              }

              if ($attempt -lt $MaxAttempts) {
                Start-Sleep -Seconds $DelaySeconds
              }
            }

            throw "HTTPS check '$Name' did not become ready after $MaxAttempts attempts. Last failure: $lastFailure"
          }

          $webHealthUrl = "https://${env:LAN_HOST_IP}:${env:HTTPS_PORT}/web-healthz"
          $apiHealthUrl = "https://${env:LAN_HOST_IP}:${env:API_HTTPS_PORT}/healthz"
          $apiDocsUrl = "https://${env:LAN_HOST_IP}:${env:API_HTTPS_PORT}/docs"

          $webHealth = Invoke-TrustedHttpsWithRetry -Name "web health" `
            -Request { Invoke-RestMethod -Uri $webHealthUrl -TimeoutSec 10 } `
            -IsReady { param($response) $response.ok -eq $true -and $response.service -eq "web" }
          if ($webHealth.ok -ne $true -or $webHealth.service -ne "web") {
            throw "HTTPS web health check failed."
          }

          $apiHealth = Invoke-TrustedHttpsWithRetry -Name "API health" `
            -Request { Invoke-RestMethod -Uri $apiHealthUrl -TimeoutSec 10 } `
            -IsReady { param($response) $response.ok -eq $true }
          if ($apiHealth.ok -ne $true) {
            throw "HTTPS API health check failed."
          }

          $apiDocs = Invoke-TrustedHttpsWithRetry -Name "API documentation" `
            -Request { Invoke-WebRequest -Uri $apiDocsUrl -UseBasicParsing -TimeoutSec 10 } `
            -IsReady { param($response) $response.StatusCode -eq 200 -and $response.Content -match "SwaggerUIBundle" }
          if ($apiDocs.StatusCode -ne 200 -or $apiDocs.Content -notmatch "SwaggerUIBundle") {
            throw "HTTPS API documentation check failed."
          }

      - name: Verify Docker Whisper runtime
        run: |
          docker compose exec -T backend sh -lc 'env | grep WHISPER && test -x "$WHISPER_PYTHON_BIN" && $WHISPER_PYTHON_BIN -m whisper --help >/dev/null && echo whisper-ok'

      - name: Verify Docker Cartesia configuration
        run: |
          docker compose exec -T backend sh -lc 'test -n "$CARTESIA_API_KEY" && test -n "$CARTESIA_VOICE_ID" && echo cartesia-config-ok'

      - name: Deployment diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 120 web
          docker compose logs --tail 120 backend
          docker compose logs --tail 120 lan-https
